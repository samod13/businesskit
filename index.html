<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BusinessKit MVP — White-Label Booking & CRM</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "var(--color-primary, #7c3aed)",
            accent: "var(--color-accent, #db2777)",
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone (100% standalone, works everywhere out of the box) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --color-primary: #7c3aed;
      --color-accent: #db2777;
    }
    .bg-primary { background-color: var(--color-primary) !important; }
    .text-primary { color: var(--color-primary) !important; }
    .border-primary { border-color: var(--color-primary) !important; }
    .ring-primary { --tw-ring-color: var(--color-primary) !important; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes scaleUp { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes bounceIn {
      0% { transform: translateY(-30px); opacity: 0; }
      60% { transform: translateY(4px); opacity: 1; }
      100% { transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-scale-up { animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-bounce-in { animation: bounceIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 font-sans antialiased selection:bg-purple-500 selection:text-white">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center p-6 text-center text-slate-500">
      <div class="space-y-3">
        <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="font-bold text-slate-700">Завантаження BusinessKit MVP...</p>
      </div>
    </div>
  </div>

  <script type="text/babel" data-type="module">
    import { businessConfig, businessPresets } from './src/config.js';
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Dynamic Date Generator ---
    function getNextDays() {
      const days = [];
      const dayNames = ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
      const monthNames = ["січ", "лют", "бер", "кві", "тра", "чер", "лип", "сер", "вер", "жов", "лис", "груд"];
      
      const now = new Date();
      for (let i = 0; i < 5; i++) {
        const d = new Date(now);
        d.setDate(now.getDate() + i);
        
        let label = dayNames[d.getDay()];
        if (i === 0) label = "Сьогодні";
        else if (i === 1) label = "Завтра";

        const sub = `${d.getDate()} ${monthNames[d.getMonth()]}`;
        const dateStr = `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')}.${d.getFullYear()}`;
        
        days.push({ label, sub, dateStr });
      }
      return days;
    }

    // --- 1. PhoneMockup Component ---
    function PhoneMockup({ children, isFullWidth, onToggleViewMode, businessName }) {
      if (isFullWidth) {
        return (
          <div className="w-full min-h-screen bg-slate-50 dark:bg-slate-900 pb-16 transition-colors duration-300">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
              <div className="flex items-center justify-between mb-4 bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <div className="flex items-center space-x-2 text-sm text-slate-600 dark:text-slate-300">
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="font-medium">Десктопний повноекранний вигляд ({businessName})</span>
                </div>
                <button
                  onClick={onToggleViewMode}
                  className="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-xs font-semibold text-slate-800 dark:text-slate-100 transition shadow-sm active:scale-95"
                >
                  <span>📱 Перейти до мобільного фрейму</span>
                </button>
              </div>
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-200/80 dark:border-slate-700/80 overflow-hidden">
                {children}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col items-center justify-center py-6 px-3 min-h-[calc(100vh-80px)]">
          <div className="mb-4 flex items-center justify-between gap-3 w-full max-w-[400px] px-2 text-xs font-medium text-slate-600 dark:text-slate-300">
            <div className="flex items-center space-x-1.5 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-full shadow-sm border border-slate-200 dark:border-slate-700">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>iPhone 15 Pro • Live Mockup</span>
            </div>
            <button
              onClick={onToggleViewMode}
              className="inline-flex items-center space-x-1 px-3 py-1.5 rounded-full bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-sm transition active:scale-95"
            >
              <span>🖥️ На весь екран</span>
            </button>
          </div>

          {/* Phone Shell */}
          <div className="relative w-full max-w-[395px] h-[844px] bg-slate-900 rounded-[52px] p-[10px] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.4),0_0_0_1px_rgba(255,255,255,0.1),inset_0_0_0_2px_rgba(255,255,255,0.15)] ring-1 ring-slate-800 flex flex-col">
            <div className="relative w-full h-full bg-white dark:bg-slate-900 rounded-[44px] overflow-hidden flex flex-col">
              
              {/* iOS Status Bar */}
              <div className="relative z-30 h-11 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-7 pt-1 select-none">
                <span className="text-xs font-semibold text-slate-900 dark:text-white tracking-tight">09:41</span>
                
                {/* Dynamic Island */}
                <div className="absolute left-1/2 -translate-x-1/2 top-2 w-[100px] h-[26px] bg-black rounded-full flex items-center justify-end px-2.5 space-x-1.5 shadow-inner">
                  <div className="w-2.5 h-2.5 rounded-full bg-slate-900 ring-1 ring-slate-800"></div>
                  <div className="w-2 h-2 rounded-full bg-emerald-500/70 animate-pulse"></div>
                </div>

                <div className="flex items-center space-x-1.5 text-xs text-slate-900 dark:text-white">
                  <span>📶</span>
                  <span>🔋</span>
                </div>
              </div>

              {/* Screen Content */}
              <div className="flex-1 overflow-y-auto overflow-x-hidden relative scrollbar-none select-none">
                {children}
              </div>

              {/* iOS Bottom Indicator */}
              <div className="relative z-30 h-6 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm flex items-center justify-center pointer-events-none">
                <div className="w-32 h-1 bg-slate-300 dark:bg-slate-600 rounded-full"></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 2. BookingModal Component ---
    function BookingModal({ service, config, isOpen, onClose, onSubmitBooking }) {
      if (!isOpen || !service) return null;

      const days = useMemo(() => getNextDays(), []);
      const timeSlots = ["09:30", "11:00", "12:30", "14:00", "15:30", "17:00", "18:30", "20:00"];

      const [selectedDay, setSelectedDay] = useState(days[1] || days[0]);
      const [selectedTime, setSelectedTime] = useState("14:00");
      const [clientName, setClientName] = useState("");
      const [clientPhone, setClientPhone] = useState("+380 ");
      const [comment, setComment] = useState("");
      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handlePhoneChange = (val) => {
        if (!val.startsWith("+380")) {
          setClientPhone("+380 ");
          return;
        }
        setClientPhone(val);
        if (errors.clientPhone) setErrors(prev => ({ ...prev, clientPhone: null }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const errs = {};
        if (!clientName.trim()) errs.clientName = "Будь ласка, вкажіть ваше ім'я";
        const digits = clientPhone.replace(/\D/g, '');
        if (digits.length < 10) {
          errs.clientPhone = "Введіть номер повністю (напр. +380 97 123 4567)";
        }
        if (!selectedTime) errs.selectedTime = "Оберіть час візиту";

        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        setIsSubmitting(true);
        setTimeout(() => {
          const newOrder = {
            id: "BK-" + Math.floor(1000 + Math.random() * 9000),
            clientName: clientName.trim(),
            clientPhone: clientPhone.trim(),
            serviceId: service.id,
            serviceName: service.name,
            price: service.price,
            currency: config.currency || "грн",
            duration: service.duration,
            date: `${selectedDay.label} (${selectedDay.sub})`,
            rawDate: selectedDay.dateStr,
            time: selectedTime,
            comment: comment.trim(),
            status: "new",
            createdAt: new Date().toISOString(),
            businessName: config.businessName
          };
          onSubmitBooking(newOrder);
          setIsSubmitting(false);
          onClose();
        }, 350);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
          <div 
            className="w-full sm:max-w-lg bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col max-h-[90vh] animate-slide-up"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Швидкий онлайн-запис</span>
                <h3 className="text-base font-bold text-slate-900 dark:text-white leading-tight">{config.businessName}</h3>
              </div>
              <button 
                onClick={onClose} 
                className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              >
                ✕
              </button>
            </div>

            <div className="p-6 overflow-y-auto space-y-5">
              {/* Selected Service Card */}
              <div className="p-4 rounded-2xl bg-gradient-to-r from-slate-50 to-slate-100 dark:from-slate-800/60 dark:to-slate-800 border border-slate-200/80 dark:border-slate-700/60 flex items-start justify-between">
                <div>
                  <span className="text-[10px] font-bold text-primary px-2 py-0.5 rounded-full bg-primary/10 inline-block mb-1">
                    {service.category || "Послуга"}
                  </span>
                  <h4 className="font-bold text-slate-900 dark:text-white text-sm sm:text-base leading-snug">{service.name}</h4>
                  <div className="mt-1 text-xs text-slate-500 dark:text-slate-400 font-medium">⏱️ {service.duration}</div>
                </div>
                <div className="text-right whitespace-nowrap pl-2">
                  <span className="text-[10px] text-slate-400 block">Вартість</span>
                  <span className="text-base sm:text-lg font-black text-slate-900 dark:text-white">{service.price} {config.currency || "грн"}</span>
                </div>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                {/* 1. Date selection */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">1. Оберіть дату візиту</label>
                  <div className="grid grid-cols-5 gap-1.5 sm:gap-2">
                    {days.map((d, i) => {
                      const isSel = selectedDay.dateStr === d.dateStr;
                      return (
                        <button
                          key={i}
                          type="button"
                          onClick={() => setSelectedDay(d)}
                          className={`p-2 rounded-xl border text-center transition ${isSel ? "border-primary bg-primary text-white shadow-md shadow-primary/25 scale-[1.02]" : "border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-slate-300 text-slate-700 dark:text-slate-200"}`}
                        >
                          <span className="text-[10px] font-semibold block uppercase">{d.label}</span>
                          <span className={`text-xs ${isSel ? "text-white/90 font-bold" : "text-slate-400 font-medium"}`}>{d.sub}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 2. Time slots */}
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">2. Оберіть зручний час</label>
                    <span className="text-[11px] text-slate-400">Вільні години</span>
                  </div>
                  <div className="grid grid-cols-4 gap-2">
                    {timeSlots.map(slot => {
                      const isSel = selectedTime === slot;
                      return (
                        <button
                          key={slot}
                          type="button"
                          onClick={() => {
                            setSelectedTime(slot);
                            if (errors.selectedTime) setErrors(prev => ({ ...prev, selectedTime: null }));
                          }}
                          className={`py-2 px-1 text-xs font-bold rounded-xl border transition ${isSel ? "border-primary bg-primary text-white shadow-sm" : "border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-slate-300 text-slate-700 dark:text-slate-200"}`}
                        >
                          {slot}
                        </button>
                      );
                    })}
                  </div>
                  {errors.selectedTime && <p className="text-xs text-rose-500 font-medium mt-1">{errors.selectedTime}</p>}
                </div>

                {/* 3. Contact Inputs */}
                <div className="space-y-3 pt-2 border-t border-slate-100 dark:border-slate-800">
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">3. Контактні дані</label>
                  
                  <div>
                    <input
                      type="text"
                      value={clientName}
                      onChange={(e) => {
                        setClientName(e.target.value);
                        if (errors.clientName) setErrors(prev => ({ ...prev, clientName: null }));
                      }}
                      placeholder="Ваше ім'я (напр. Олена чи Олександр)"
                      className={`w-full px-3.5 py-2.5 text-sm rounded-xl border bg-slate-50/50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 ${errors.clientName ? "border-rose-400" : "border-slate-200 dark:border-slate-700 focus:border-primary"}`}
                    />
                    {errors.clientName && <p className="text-xs text-rose-500 font-medium mt-1">{errors.clientName}</p>}
                  </div>

                  <div>
                    <input
                      type="tel"
                      value={clientPhone}
                      onChange={(e) => handlePhoneChange(e.target.value)}
                      placeholder="+380 97 123 4567"
                      className={`w-full px-3.5 py-2.5 text-sm rounded-xl border bg-slate-50/50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 ${errors.clientPhone ? "border-rose-400" : "border-slate-200 dark:border-slate-700 focus:border-primary"}`}
                    />
                    {errors.clientPhone && <p className="text-xs text-rose-500 font-medium mt-1">{errors.clientPhone}</p>}
                  </div>

                  <div>
                    <input
                      type="text"
                      value={comment}
                      onChange={(e) => setComment(e.target.value)}
                      placeholder="Побажання чи коментар майстру (необов'язково)"
                      className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-primary"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full py-3.5 px-4 rounded-2xl bg-primary hover:opacity-95 text-white font-bold text-sm tracking-wide shadow-lg shadow-primary/25 transition active:scale-[0.99] flex items-center justify-center space-x-2 mt-4"
                >
                  {isSubmitting ? (
                    <span>Створення запису...</span>
                  ) : (
                    <span>✨ Підтвердити запис ({service.price} {config.currency || "грн"})</span>
                  )}
                </button>
                <p className="text-[11px] text-center text-slate-400">🔒 Миттєве бронювання • Оплата на місці</p>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // --- 3. TelegramAlert Component ---
    function TelegramAlert({ order, onClose, onOpenAdmin }) {
      if (!order) return null;

      useEffect(() => {
        // Audio Chime using Web Audio API
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(659.25, ctx.currentTime); // E5
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          }
        } catch (e) {}

        // Rich Console Output
        console.log(
          `%c ✈️ [Telegram Bot Alert] %c Новий запис: ${order.clientName} (${order.clientPhone}) | ${order.serviceName} - ${order.price} грн`,
          'background: #0088cc; color: #fff; font-weight: bold; border-radius: 4px; padding: 4px 8px;',
          'color: #0088cc; font-weight: bold;'
        );
        console.table({
          "ID Замовлення": order.id,
          "Клієнт": order.clientName,
          "Телефон": order.clientPhone,
          "Послуга": order.serviceName,
          "Дата та час": `${order.date}, о ${order.time}`,
          "Сума": `${order.price} ${order.currency}`,
          "Коментар": order.comment || "Без коментаря"
        });
      }, [order]);

      return (
        <div className="fixed inset-x-4 top-4 md:top-6 md:right-6 md:left-auto md:max-w-md z-50 animate-bounce-in">
          <div className="bg-slate-900/95 text-white backdrop-blur-xl border border-sky-500/40 rounded-3xl shadow-2xl p-5 ring-1 ring-white/10">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white shadow-md font-bold text-sm">
                  ✈️
                </div>
                <div>
                  <div className="flex items-center space-x-1.5">
                    <span className="text-xs font-bold text-sky-400">Telegram Bot Notification</span>
                    <span className="text-[10px] bg-sky-500/20 text-sky-300 px-1.5 py-0.5 rounded-full font-mono font-medium">LIVE</span>
                  </div>
                  <p className="text-[11px] text-slate-400">Канал сповіщень адміністратора</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">✕</button>
            </div>

            <div className="bg-slate-950/70 rounded-2xl p-3.5 border border-slate-800 font-mono text-xs space-y-1.5">
              <div className="text-emerald-400 font-semibold font-sans">✨ Новий запис від BusinessKit!</div>
              <div className="h-px bg-slate-800 my-1"></div>
              <div className="grid grid-cols-[75px_1fr] gap-x-2 text-[11px]">
                <span className="text-slate-400">Клієнт:</span>
                <span className="text-white font-medium font-sans">{order.clientName}</span>
                <span className="text-slate-400">Телефон:</span>
                <span className="text-sky-400 font-sans">{order.clientPhone}</span>
                <span className="text-slate-400">Послуга:</span>
                <span className="text-white font-sans">{order.serviceName}</span>
                <span className="text-slate-400">Час:</span>
                <span className="text-amber-300 font-sans">{order.date}, о {order.time}</span>
                <span className="text-slate-400">Сума:</span>
                <span className="text-emerald-400 font-bold font-sans">{order.price} {order.currency || "грн"}</span>
              </div>
            </div>

            <div className="mt-3.5 flex items-center gap-2">
              <button
                onClick={() => { onOpenAdmin(); onClose(); }}
                className="flex-1 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2 px-3 rounded-xl text-xs transition active:scale-95 text-center shadow-md shadow-sky-500/20"
              >
                Відкрити в Адмінці
              </button>
              <button
                onClick={onClose}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium"
              >
                Згорнути
              </button>
            </div>

    // --- 5. AdminDashboard Component ---
    function AdminDashboard({ orders, onUpdateStatus, onDeleteOrder, onAddSampleOrder, onResetOrders, config }) {
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("all");

      const filtered = useMemo(() => {
        return orders.filter(o => {
          const match = o.clientName?.toLowerCase().includes(search.toLowerCase()) ||
            o.clientPhone?.toLowerCase().includes(search.toLowerCase()) ||
            o.serviceName?.toLowerCase().includes(search.toLowerCase()) ||
            o.id?.toLowerCase().includes(search.toLowerCase());
          return match && (filter === "all" || o.status === filter);
        });
      }, [orders, search, filter]);

      const totalRevenue = orders.filter(o => o.status !== 'cancelled').reduce((acc, c) => acc + (Number(c.price) || 0), 0);
      const newCount = orders.filter(o => o.status === 'new').length;
      const confirmedCount = orders.filter(o => o.status === 'confirmed').length;
      const completedCount = orders.filter(o => o.status === 'completed').length;

      // Export to CSV Function
      const handleExportCSV = () => {
        const headers = ["ID", "Час створення", "Клієнт", "Телефон", "Послуга", "Дата візиту", "Час", "Ціна", "Валюта", "Статус", "Коментар"];
        const rows = orders.map(o => [
          o.id,
          o.createdAt,
          o.clientName,
          o.clientPhone,
          o.serviceName,
          o.date,
          o.time,
          o.price,
          o.currency,
          o.status,
          `"${o.comment || ''}"`
        ]);

        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `businesskit_leads_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in font-sans">
          
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">

              </div>

                onClick={onAddSampleOrder}

              >
                <span>➕ Тестовий лід</span>
              </button>
              <button
                onClick={handleExportCSV}
                className="px-3.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 font-bold text-xs transition active:scale-95 flex items-center space-x-1"

                            onClick={() => { if(confirm(`Видалити запис ${order.id} клієнта ${order.clientName}?`)) onDeleteOrder(order.id); }}
                            className="p-1.5 text-slate-400 hover:text-rose-500 rounded-lg hover:bg-slate-100 transition"
                            title="Видалити"
                          >
                            🗑️
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                  {filtered.length === 0 && (
                    <tr>
                      <td colSpan="7" className="py-12 text-center text-slate-400">
                        Не знайдено жодного замовлення за вказаними фільтрами
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- 6. WhiteLabelDemo Component ---
    function WhiteLabelDemo({ currentConfig, onSelectPreset, onCustomUpdate, isOpen, onClose }) {
      if (!isOpen) return null;

      const [tempName, setTempName] = useState(currentConfig.businessName);
      const [tempCategory, setTempCategory] = useState(currentConfig.category);
      const [tempPrimary, setTempPrimary] = useState(currentConfig.primaryColor);
      const [tempAccent, setTempAccent] = useState(currentConfig.accentColor);

      const presets = [
        { id: "beautySalon", name: "Салон краси & SPA", brand: "Luxe Studio", icon: "💅", colors: ["#7c3aed", "#db2777"], data: businessPresets.beautySalon },
        { id: "barberShop", name: "Чоловічий барбершоп", brand: "Blade & Barber", icon: "💈", colors: ["#d97706", "#334155"], data: businessPresets.barberShop },
        { id: "autoDetailing", name: "Детейлінг & Автосервіс", brand: "Apex Auto Spa", icon: "🚗", colors: ["#0284c7", "#ef4444"], data: businessPresets.autoDetailing },
        { id: "coffeeRoastery", name: "Кав'ярня третьої хвилі", brand: "Kava Craft", icon: "☕", colors: ["#92400e", "#ea580c"], data: businessPresets.coffeeRoastery }
      ];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in font-sans">
          <div className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 animate-scale-up">
            <div className="flex justify-between items-center pb-4 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 className="text-base font-black text-slate-900 dark:text-white">White-Label Конфігуратор</h3>
                <p className="text-xs text-slate-500">Миттєве перемикання ніші або кольорів</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-3 my-4">
              {presets.map(p => (
                <button
                  key={p.id}
                  onClick={() => { onSelectPreset(p.data); onClose(); }}
                  className={`p-3.5 rounded-2xl border text-left transition ${currentConfig.businessName === p.brand ? "border-primary bg-primary/5 ring-2 ring-primary/20" : "border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-slate-300"}`}
                >
                  <div className="text-2xl mb-1">{p.icon}</div>
                  <div className="font-bold text-sm text-slate-900 dark:text-white">{p.brand}</div>
                  <div className="text-xs text-slate-500">{p.name}</div>
                </button>
              ))}
            </div>

            <div className="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-3">
              <label className="block text-xs font-bold uppercase text-slate-500">Швидка зміна кольорів наживо</label>
              <div className="grid grid-cols-2 gap-3">
                <div className="flex items-center space-x-2">
                  <input
                    type="color"
                    value={tempPrimary}
                    onChange={(e) => {
                      setTempPrimary(e.target.value);
                      onCustomUpdate({ primaryColor: e.target.value });
                    }}
                    className="w-8 h-8 rounded cursor-pointer"
                  />
                  <span className="text-xs font-mono">{tempPrimary}</span>
                </div>
                <div className="flex items-center space-x-2">
                  <input
                    type="color"
                    value={tempAccent}
                    onChange={(e) => {
                      setTempAccent(e.target.value);
                      onCustomUpdate({ accentColor: e.target.value });
                    }}
                    className="w-8 h-8 rounded cursor-pointer"
                  />
                  <span className="text-xs font-mono">{tempAccent}</span>
                </div>
              </div>
            </div>

            <p className="text-[11px] text-center text-slate-400 mt-4">
              💡 Головний файл налаштувань: <code className="text-primary font-bold">src/config.js</code>
            </p>
          </div>
        </div>
      );
    }

    // --- Main Application Controller ---
    function MainApp() {
      const [tab, setTab] = useState("customer");
      const [fullWidth, setFullWidth] = useState(false);
      const [cfg, setCfg] = useState(businessConfig);

      const [orders, setOrders] = useState(() => {
        try {
          const s = localStorage.getItem("businesskit_orders");
          return s ? JSON.parse(s) : [
            { id: "BK-7891", clientName: "Олена Коваленко", clientPhone: "+380 67 111 22 33", serviceName: "Комплексний преміум-манікюр", price: 750, duration: "60 хв", date: "Завтра", time: "14:00", comment: "Прошу нагадати за годину", status: "new", createdAt: new Date(Date.now() - 15 * 60000).toISOString() },
            { id: "BK-7890", clientName: "Максим Шевченко", clientPhone: "+380 50 222 33 44", serviceName: "Стрижка та авторське укладання", price: 650, duration: "45 хв", date: "Сьогодні", time: "17:30", comment: "", status: "confirmed", createdAt: new Date(Date.now() - 120 * 60000).toISOString() },
            { id: "BK-7889", clientName: "Ірина Мельник", clientPhone: "+380 93 444 55 66", serviceName: "SPA-догляд та масаж обличчя", price: 1200, duration: "60 хв", date: "23 вер", time: "11:00", comment: "Чутлива шкіра", status: "completed", createdAt: new Date(Date.now() - 360 * 60000).toISOString() }
          ];
        } catch (e) { return []; }
      });

      const [telegramNotif, setTelegramNotif] = useState(null);
      const [lastOrder, setLastOrder] = useState(null);
      const [wlOpen, setWlOpen] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem("businesskit_orders", JSON.stringify(orders));
        } catch (e) {}
      }, [orders]);

      useEffect(() => {
        const root = document.documentElement;
        if (cfg.primaryColor) root.style.setProperty('--color-primary', cfg.primaryColor);
        if (cfg.accentColor) root.style.setProperty('--color-accent', cfg.accentColor);
      }, [cfg]);

      const handleNewBooking = (newOrder) => {
        setOrders(prev => [newOrder, ...prev]);
        setLastOrder(newOrder);
        setTelegramNotif(newOrder);
      };

      const handleAddSampleOrder = () => {
        const names = ["Денис Кравчук", "Марія Литвин", "Артем Васильєв", "Світлана Ткач", "Віталій Поліщук"];
        const randomName = names[Math.floor(Math.random() * names.length)];
        const srv = cfg.services[Math.floor(Math.random() * cfg.services.length)] || { name: "Індивідуальна консультація", price: 500, duration: "30 хв" };
        
        handleNewBooking({
          id: "BK-" + Math.floor(1000 + Math.random() * 9000),
          clientName: randomName,
          clientPhone: `+380 97 ${Math.floor(100 + Math.random() * 900)} ${Math.floor(10 + Math.random() * 90)} ${Math.floor(10 + Math.random() * 90)}`,
          serviceName: srv.name,
          price: srv.price,
          currency: cfg.currency || "грн",
          duration: srv.duration,
          date: "Сьогодні",
          time: "16:30",
          comment: "Тестовий лід для демонстрації",
          status: "new",
          createdAt: new Date().toISOString()
        });
      };

      return (
        <div className="min-h-screen bg-slate-100 dark:bg-slate-950 flex flex-col font-sans transition-colors">
          {/* Top Bar */}
          <header className="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm px-4 sm:px-6 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-primary to-indigo-600 flex items-center justify-center text-white font-black text-base shadow-md shadow-primary/20">
                  BK
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-sm sm:text-base tracking-tight text-slate-900 dark:text-white">BusinessKit</span>
                    <span className="text-[10px] font-bold uppercase bg-primary/10 text-primary px-2 py-0.5 rounded-full border border-primary/20">White-Label MVP</span>
                  </div>
                  <p className="text-[11px] text-slate-500 hidden sm:block">Поточний бізнес: <strong>{cfg.businessName}</strong> ({cfg.category})</p>
                </div>
              </div>

              {/* Mode Switcher */}
              <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl border border-slate-200 dark:border-slate-700">
                <button
                  onClick={() => setTab("customer")}
                  className={`flex items-center space-x-1.5 px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition ${tab === "customer" ? "bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm" : "text-slate-500 hover:text-slate-900"}`}
                >
                  <span>📱</span>
                  <span>Клієнтський віджет</span>
                </button>
                <button
                  onClick={() => setTab("admin")}
                  className={`flex items-center space-x-1.5 px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition ${tab === "admin" ? "bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm" : "text-slate-500 hover:text-slate-900"}`}
                >
                  <span>💼</span>
                  <span>Адмін-панель</span>
                  {orders.filter(o => o.status === 'new').length > 0 && (
                    <span className="w-5 h-5 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center shadow-sm">
                      {orders.filter(o => o.status === 'new').length}
                    </span>
                  )}
                </button>
              </div>

              {/* White-Label Button */}
              <button
                onClick={() => setWlOpen(true)}
                className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold text-xs shadow-md shadow-indigo-500/20 transition active:scale-95 flex items-center space-x-1.5"
              >
                <span>🎨</span>
                <span className="hidden md:inline">White-Label Конфіг</span>
              </button>
            </div>
          </header>

          {/* Viewport */}
          <main className="flex-1">
            {tab === "customer" ? (
              <PhoneMockup isFullWidth={fullWidth} onToggleViewMode={() => setFullWidth(!fullWidth)} businessName={cfg.businessName}>
                <CustomerApp config={cfg} onBookService={handleNewBooking} lastOrder={lastOrder} onResetLastOrder={() => setLastOrder(null)} />
              </PhoneMockup>
            ) : (
              <AdminDashboard
                orders={orders}
                config={cfg}
                onUpdateStatus={(id, st) => setOrders(prev => prev.map(o => o.id === id ? { ...o, status: st } : o))}
                onDeleteOrder={(id) => setOrders(prev => prev.filter(o => o.id !== id))}
                onAddSampleOrder={handleAddSampleOrder}
                onResetOrders={() => {
                  if (confirm("Скинути базу замовлень до початкових демо-записів?")) {
                    localStorage.removeItem("businesskit_orders");
                    window.location.reload();
                  }
                }}
              />
            )}
          </main>

          {/* Telegram Alert Notification */}
          <TelegramAlert
            order={telegramNotif}
            onClose={() => setTelegramNotif(null)}
            onOpenAdmin={() => { setTab("admin"); setTelegramNotif(null); }}
          />

          {/* White-Label Configurator Modal */}
          <WhiteLabelDemo
            currentConfig={cfg}
            isOpen={wlOpen}
            onClose={() => setWlOpen(false)}
            onSelectPreset={(p) => setCfg(p)}
            onCustomUpdate={(custom) => setCfg(prev => ({ ...prev, ...custom }))}
          />
        </div>
      );
    }

    // Mount to root
    const rootEl = document.getElementById('root');
    if (rootEl) {
      ReactDOM.createRoot(rootEl).render(<MainApp />);
    }
  </script>
</body>
</html>
